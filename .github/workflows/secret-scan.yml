name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable Git history with gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "${archive}"
          curl --fail --location --silent --show-error "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="--all" .

  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/scan_secrets.py
      - run: python -m pytest -q
