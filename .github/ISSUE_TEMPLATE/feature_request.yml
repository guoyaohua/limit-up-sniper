name: 功能建议
description: 建议非策略类的工程、数据、监控或文档改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 当前工作流中遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望行为、输入输出和影响模块。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。说明已经尝试或考虑过的方案。
  - type: textarea
    id: safety
    attributes:
      label: 兼容性与交易安全
      description: 说明对 simulation、shadow、live、数据格式或资源占用的影响。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 内容不包含凭据、个人信息或未经授权的行情数据。
          required: true
