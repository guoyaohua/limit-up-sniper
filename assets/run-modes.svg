<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Limit-Up Sniper 部署和三种运行模式</title>
  <desc id="desc">一次部署和配置后，可选择实时模拟、实盘加影子、Tick 归档回测三种隔离路径。只有实盘主策略会向 QMT 发送委托。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08182a"/>
      <stop offset="1" stop-color="#153956"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bd5ff"/>
      <stop offset="1" stop-color="#8affc5"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#83e6ff"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #f4fbff; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #aac7da; }
      .step { font: 700 14px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1px; fill: #83e6ff; }
      .head { font: 700 22px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #f4fbff; }
      .body { font: 400 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #c9ddea; }
      .small { font: 400 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #aac7da; }
      .dark { font: 700 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #07182a; }
      .card { fill: #102c47; stroke: #2b5876; stroke-width: 1.5; }
      .card-safe { fill: #13344e; stroke: url(#safe); stroke-width: 2; }
      .arrow { fill: none; stroke: #83e6ff; stroke-width: 3; marker-end: url(#arrow2); }
      .dash { fill: none; stroke: #6f8fa6; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow2); }
    </style>
  </defs>

  <rect width="1280" height="610" rx="28" fill="url(#bg2)"/>
  <text x="64" y="65" class="title">一次配置，三条互相隔离的运行路径</text>
  <text x="64" y="94" class="subtitle">默认命令永远进入模拟；切换实盘需要专用入口和人工再次确认</text>

  <g filter="url(#shadow2)">
    <rect x="55" y="145" width="245" height="160" rx="20" class="card"/>
    <text x="79" y="180" class="step">首次准备</text>
    <text x="79" y="216" class="head">deploy.cmd</text>
    <text x="79" y="247" class="body">创建 .venv · 安装依赖</text>
    <text x="79" y="273" class="body">从模板生成 .env</text>
  </g>

  <path d="M300 225H364" class="arrow"/>

  <g filter="url(#shadow2)">
    <rect x="376" y="145" width="245" height="160" rx="20" class="card"/>
    <text x="400" y="180" class="step">本机配置</text>
    <text x="400" y="216" class="head">QMT + .env</text>
    <text x="400" y="247" class="body">userdata_mini · 资金账号</text>
    <text x="400" y="273" class="body">启动 QMT / XTQuant 服务</text>
  </g>

  <path d="M621 225H685" class="arrow"/>

  <g filter="url(#shadow2)">
    <rect x="697" y="135" width="245" height="180" rx="20" class="card-safe"/>
    <rect x="721" y="158" width="84" height="28" rx="14" fill="#8affc5"/>
    <text x="739" y="178" class="dark">推荐起点</text>
    <text x="721" y="222" class="head">实时模拟</text>
    <text x="721" y="253" class="body">run-simulation.cmd</text>
    <text x="721" y="279" class="small">实时行情 → SQLite 纸面账户</text>
    <text x="721" y="300" class="small">不向 QMT 发送委托</text>
  </g>

  <path d="M942 225H1006" class="arrow"/>

  <g filter="url(#shadow2)">
    <rect x="1018" y="135" width="207" height="180" rx="20" class="card"/>
    <text x="1042" y="170" class="step">明确切换</text>
    <text x="1042" y="208" class="head">实盘主策略</text>
    <text x="1042" y="239" class="body">run-live.cmd</text>
    <text x="1042" y="265" class="small">输入 yes 后才会继续</text>
    <text x="1042" y="288" class="small">会向所配 QMT 账号委托</text>
  </g>

  <path d="M1121 315V374" class="dash"/>
  <path d="M820 315V374" class="arrow"/>
  <path d="M498 305V374" class="dash"/>

  <g filter="url(#shadow2)">
    <rect x="376" y="390" width="245" height="155" rx="20" class="card"/>
    <text x="400" y="425" class="step">行情证据</text>
    <text x="400" y="461" class="head">Tick 归档</text>
    <text x="400" y="492" class="body">capture_ticks.py --verify</text>
    <text x="400" y="518" class="small">分段 gzip · manifest · SHA-256</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="697" y="390" width="245" height="155" rx="20" class="card"/>
    <text x="721" y="425" class="step">并行探索</text>
    <text x="721" y="461" class="head">影子策略</text>
    <text x="721" y="492" class="body">-EnableShadow</text>
    <text x="721" y="518" class="small">同源 Tick · 独立状态 · 不下实单</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1018" y="390" width="207" height="155" rx="20" class="card"/>
    <text x="1042" y="425" class="step">统一复核</text>
    <text x="1042" y="461" class="head">事件回放</text>
    <text x="1042" y="492" class="body">run_backtest.py</text>
    <text x="1042" y="518" class="small">成本 · T+1 · 排队 · 回撤</text>
  </g>

  <path d="M621 468H685" class="arrow"/>
  <path d="M942 468H1006" class="arrow"/>
</svg>
